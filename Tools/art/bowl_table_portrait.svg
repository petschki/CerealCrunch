<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 2048">
  <defs>
    <g id="sparkle">
      <path d="M0 -22 L5 -5 L22 0 L5 5 L0 22 L-5 5 L-22 0 L-5 -5 Z" fill="#ffffff"/>
    </g>
    <g id="goldstar">
      <path d="M0 -20 L6 -6 L20 -6 L9 3 L13 18 L0 9 L-13 18 L-9 3 L-20 -6 L-6 -6 Z" fill="#f5c542" stroke="#232b38" stroke-width="5"/>
    </g>
    <g id="ball">
      <circle r="20" stroke="#232b38" stroke-width="6"/>
      <circle cx="-6" cy="-7" r="5" fill="#ffffff" opacity="0.7"/>
    </g>
    <g id="jug">
      <!-- milk jug ~290x330: handle first (behind), body with spout on top -->
      <path d="M225 80 Q 300 100 292 185 Q 286 248 225 258" fill="none" stroke="#232b38" stroke-width="11"/>
      <path d="M228 94 Q 282 110 276 180 Q 271 230 228 242" fill="none" stroke="#bcd8e8" stroke-width="16"/>
      <path d="M32 62 L 8 28 L 72 46 L 208 46 Q 230 46 233 68 Q 252 185 228 322 L 38 322 Q 12 185 32 62 Z"
            fill="#fdfeff" stroke="#232b38" stroke-width="9"/>
      <path d="M40 98 Q 132 130 224 100 L 230 142 Q 132 172 34 140 Z"
            fill="#cfe8f4" stroke="#9fc3d8" stroke-width="6"/>
      <path d="M58 168 Q 64 250 80 300" fill="none" stroke="#d8e8f2" stroke-width="16" stroke-linecap="round"/>
    </g>
    <g id="strawberry">
      <path d="M0 -20 Q 26 -14 24 8 Q 20 30 0 40 Q -20 30 -24 8 Q -26 -14 0 -20 Z"
            fill="#e2544a" stroke="#232b38" stroke-width="6"/>
      <path d="M-14 -18 L 0 -30 L 14 -18 L 6 -12 L -6 -12 Z" fill="#4da44e" stroke="#232b38" stroke-width="5"/>
      <circle cx="-8" cy="4" r="2.5" fill="#fdf0c0"/>
      <circle cx="8" cy="2" r="2.5" fill="#fdf0c0"/>
      <circle cx="0" cy="18" r="2.5" fill="#fdf0c0"/>
    </g>
  </defs>

  <!-- Wall with light rays -->
  <rect x="0" y="0" width="1024" height="700" fill="#f7e29b"/>
  <path d="M300 0 L 560 0 L 300 700 L 120 700 Z" fill="#fcf0bf" opacity="0.6"/>
  <path d="M700 0 L 860 0 L 1024 420 L 1024 200 Z" fill="#fcf0bf" opacity="0.5"/>

  <!-- Window with plant -->
  <g>
    <rect x="36" y="56" width="330" height="290" rx="10" fill="#f5efdc" stroke="#232b38" stroke-width="10"/>
    <rect x="60" y="80" width="282" height="242" fill="#bfe0ee" stroke="#232b38" stroke-width="7"/>
    <path d="M84 300 L 200 96 M140 312 L 268 90" stroke="#eaf6fc" stroke-width="16" stroke-linecap="round"/>
    <rect x="196" y="80" width="10" height="242" fill="#f5efdc" stroke="#232b38" stroke-width="5"/>
    <!-- plant on sill -->
    <path d="M84 60 q -4 -34 10 -54 M96 58 q 8 -30 30 -40 M90 60 q -22 -18 -28 -40"
          fill="none" stroke="#4da44e" stroke-width="10" stroke-linecap="round"/>
    <path d="M64 56 L 118 56 L 110 96 L 72 96 Z" fill="#d97f4a" stroke="#232b38" stroke-width="7"/>
  </g>

  <!-- Sparkles, stars, floating cereal, confetti -->
  <use href="#sparkle" x="480" y="120"/>
  <use href="#sparkle" x="900" y="90" transform="scale(0.8)"/>
  <use href="#sparkle" x="620" y="330"/>
  <use href="#goldstar" x="430" y="240"/>
  <use href="#goldstar" x="950" y="300"/>
  <use href="#ball" x="560" y="200" fill="#e26a8d"/>
  <use href="#ball" x="660" y="150" fill="#e8873c"/>
  <use href="#ball" x="760" y="240" fill="#8a5a33"/>
  <use href="#ball" x="500" y="430" fill="#7890d0"/>
  <rect x="820" y="140" width="46" height="40" fill="#a8d878" stroke="#232b38" stroke-width="6" transform="rotate(12 843 160)"/>
  <rect x="380" y="60" width="40" height="36" fill="#7ec8e8" stroke="#232b38" stroke-width="6" transform="rotate(-14 400 78)"/>
  <path d="M60 480 l 10 20 22 3 -16 15 4 22 -20 -11 -20 11 4 -22 -16 -15 22 -3 Z" fill="#ffffff" opacity="0.9"/>

  <!-- Milk drips top right -->
  <g fill="#ffffff" stroke="#232b38" stroke-width="5">
    <path d="M930 420 q 8 -18 16 0 a 8 8 0 1 1 -16 0"/>
    <path d="M980 460 q 7 -15 14 0 a 7 7 0 1 1 -14 0"/>
  </g>

  <!-- Back counter: red top, teal front with hatching -->
  <rect x="0" y="640" width="1024" height="96" fill="#e0574f" stroke="#232b38" stroke-width="9"/>
  <rect x="0" y="736" width="1024" height="380" fill="#46b8c8" stroke="#232b38" stroke-width="9"/>
  <g stroke="#2f97a8" stroke-width="8" opacity="0.9">
    <path d="M80 780 l -30 90"/><path d="M240 800 l -30 90"/><path d="M420 770 l -30 90"/>
    <path d="M600 800 l -30 90"/><path d="M780 775 l -30 90"/><path d="M950 800 l -30 90"/>
    <path d="M160 960 l -26 80"/><path d="M340 980 l -26 80"/><path d="M520 950 l -26 80"/>
    <path d="M700 980 l -26 80"/><path d="M880 955 l -26 80"/>
  </g>

  <!-- Items on the back counter -->
  <!-- big milk jugs right -->
  <use href="#jug" transform="translate(690 320) scale(1.05)"/>
  <use href="#jug" transform="translate(520 400) scale(0.72)"/>
  <!-- blue bowl with cereal balls, left -->
  <g>
    <g fill="#e8b04c">
      <use href="#ball" x="150" y="530"/><use href="#ball" x="200" y="512"/><use href="#ball" x="252" y="528"/>
      <use href="#ball" x="176" y="496" fill="#c98a3c"/><use href="#ball" x="228" y="492" fill="#c98a3c"/>
    </g>
    <path d="M70 540 Q 78 656 200 656 Q 322 656 330 540 Q 200 574 70 540 Z"
          fill="#8fc3ea" stroke="#232b38" stroke-width="9"/>
    <ellipse cx="200" cy="543" rx="131" ry="30" fill="none" stroke="#232b38" stroke-width="9"/>
    <path d="M96 590 q 12 34 48 44" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
  </g>
  <!-- yellow bowl with blueberries -->
  <g>
    <g fill="#6b4a8f">
      <use href="#ball" x="400" y="560" transform="scale(0.8)"/>
      <circle cx="382" cy="562" r="15" fill="#6b4a8f" stroke="#232b38" stroke-width="6"/>
      <circle cx="418" cy="556" r="15" fill="#7d5ba3" stroke="#232b38" stroke-width="6"/>
      <circle cx="400" cy="540" r="15" fill="#6b4a8f" stroke="#232b38" stroke-width="6"/>
      <path d="M400 522 q 14 -18 30 -16" fill="none" stroke="#4da44e" stroke-width="8" stroke-linecap="round"/>
    </g>
    <path d="M340 570 Q 346 648 400 648 Q 454 648 460 570 Q 400 590 340 570 Z"
          fill="#f0b429" stroke="#232b38" stroke-width="8"/>
  </g>
  <!-- small red sugar bowl with spoon far left -->
  <g>
    <rect x="24" y="470" width="10" height="80" rx="5" fill="#c9ced4" stroke="#232b38" stroke-width="5" transform="rotate(18 29 510)"/>
    <path d="M0 540 Q 6 640 60 640 Q 114 640 120 540 Q 60 562 0 540 Z" fill="#d84848" stroke="#232b38" stroke-width="8"/>
    <ellipse cx="60" cy="545" rx="55" ry="16" fill="#ffffff" stroke="#232b38" stroke-width="6"/>
  </g>
  <!-- plate with loops center -->
  <g>
    <ellipse cx="560" cy="640" rx="100" ry="26" fill="#f4f8fb" stroke="#232b38" stroke-width="8"/>
    <g fill="none" stroke-width="12">
      <circle cx="530" cy="620" r="16" stroke="#e8a83c"/>
      <circle cx="570" cy="614" r="16" stroke="#d9821e"/>
      <circle cx="600" cy="624" r="16" stroke="#e8a83c"/>
    </g>
  </g>

  <!-- Front table: warm top + striped runner (board covers most of this) -->
  <rect x="0" y="1116" width="1024" height="110" fill="#f2a93b" stroke="#232b38" stroke-width="9"/>
  <g>
    <rect x="0" y="1226" width="1024" height="420" fill="#fdf0f4"/>
    <g fill="#f2b8cc">
      <rect x="0" y="1226" width="80" height="420"/><rect x="160" y="1226" width="80" height="420"/>
      <rect x="320" y="1226" width="80" height="420"/><rect x="480" y="1226" width="80" height="420"/>
      <rect x="640" y="1226" width="80" height="420"/><rect x="800" y="1226" width="80" height="420"/>
      <rect x="960" y="1226" width="64" height="420"/>
    </g>
    <rect x="0" y="1226" width="1024" height="420" fill="none" stroke="#232b38" stroke-width="8"/>
  </g>

  <!-- Tablecloth front -->
  <rect x="0" y="1646" width="1024" height="402" fill="#3fb0c4" stroke="#232b38" stroke-width="9"/>
  <g stroke="#2f97a8" stroke-width="8" opacity="0.9">
    <path d="M120 1740 l -34 110"/><path d="M320 1760 l -34 110"/><path d="M540 1735 l -34 110"/>
    <path d="M760 1765 l -34 110"/><path d="M950 1740 l -34 110"/>
  </g>

  <!-- Bottom strip (visible below the board): fruit plate, spoon, chocolate bowl -->
  <g>
    <ellipse cx="190" cy="1950" rx="150" ry="40" fill="#f4f8fb" stroke="#232b38" stroke-width="9"/>
    <use href="#strawberry" transform="translate(140 1930) scale(1.15)"/>
    <use href="#strawberry" transform="translate(220 1940) scale(0.95) rotate(14)"/>
  </g>
  <g transform="rotate(-10 480 1960)">
    <rect x="468" y="1900" width="22" height="120" rx="11" fill="#d4dade" stroke="#232b38" stroke-width="7"/>
    <ellipse cx="479" cy="1886" rx="32" ry="42" fill="#e4eaee" stroke="#232b38" stroke-width="7"/>
  </g>
  <!-- teal square bowl with chocolate cubes, right, partially cropped -->
  <g>
    <g stroke="#232b38" stroke-width="7" fill="#6b4226">
      <rect x="760" y="1868" width="52" height="48" rx="10"/>
      <rect x="820" y="1852" width="52" height="48" rx="10" fill="#7d4e2c"/>
      <rect x="884" y="1870" width="52" height="48" rx="10"/>
    </g>
    <circle cx="786" cy="1892" r="6" fill="#3d2412"/>
    <circle cx="846" cy="1876" r="6" fill="#3d2412"/>
    <circle cx="910" cy="1894" r="6" fill="#3d2412"/>
    <path d="M730 1900 L 970 1900 L 940 2010 L 760 2010 Z" fill="#46b8c8" stroke="#232b38" stroke-width="9"/>
  </g>
  <use href="#ball" x="620" y="1990" fill="#e26a8d"/>
  <use href="#ball" x="60" y="2010" fill="#e8873c"/>
</svg>
