<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <g id="sparkle">
      <path d="M0 -22 L5 -5 L22 0 L5 5 L0 22 L-5 5 L-22 0 L-5 -5 Z" fill="#ffffff"/>
    </g>
    <g id="goldstar">
      <path d="M0 -20 L6 -6 L20 -6 L9 3 L13 18 L0 9 L-13 18 L-9 3 L-20 -6 L-6 -6 Z" fill="#f5c542" stroke="#232b38" stroke-width="5"/>
    </g>
    <g id="ball">
      <circle r="20" stroke="#232b38" stroke-width="6"/>
      <circle cx="-6" cy="-7" r="5" fill="#ffffff" opacity="0.7"/>
    </g>
    <g id="jug">
      <path d="M225 80 Q 300 100 292 185 Q 286 248 225 258" fill="none" stroke="#232b38" stroke-width="11"/>
      <path d="M228 94 Q 282 110 276 180 Q 271 230 228 242" fill="none" stroke="#bcd8e8" stroke-width="16"/>
      <path d="M32 62 L 8 28 L 72 46 L 208 46 Q 230 46 233 68 Q 252 185 228 322 L 38 322 Q 12 185 32 62 Z"
            fill="#fdfeff" stroke="#232b38" stroke-width="9"/>
      <path d="M40 98 Q 132 130 224 100 L 230 142 Q 132 172 34 140 Z"
            fill="#cfe8f4" stroke="#9fc3d8" stroke-width="6"/>
      <path d="M58 168 Q 64 250 80 300" fill="none" stroke="#d8e8f2" stroke-width="16" stroke-linecap="round"/>
    </g>
    <g id="strawberry">
      <path d="M0 -20 Q 26 -14 24 8 Q 20 30 0 40 Q -20 30 -24 8 Q -26 -14 0 -20 Z"
            fill="#e2544a" stroke="#232b38" stroke-width="6"/>
      <path d="M-14 -18 L 0 -30 L 14 -18 L 6 -12 L -6 -12 Z" fill="#4da44e" stroke="#232b38" stroke-width="5"/>
      <circle cx="-8" cy="4" r="2.5" fill="#fdf0c0"/>
      <circle cx="8" cy="2" r="2.5" fill="#fdf0c0"/>
      <circle cx="0" cy="18" r="2.5" fill="#fdf0c0"/>
    </g>
  </defs>

  <!-- Wall with light rays -->
  <rect x="0" y="0" width="1024" height="420" fill="#f7e29b"/>
  <path d="M300 0 L 520 0 L 340 420 L 160 420 Z" fill="#fcf0bf" opacity="0.6"/>
  <path d="M720 0 L 860 0 L 1024 300 L 1024 140 Z" fill="#fcf0bf" opacity="0.5"/>

  <!-- Window with plant -->
  <g>
    <rect x="36" y="40" width="290" height="250" rx="10" fill="#f5efdc" stroke="#232b38" stroke-width="10"/>
    <rect x="58" y="62" width="246" height="206" fill="#bfe0ee" stroke="#232b38" stroke-width="7"/>
    <path d="M80 250 L 180 80 M128 260 L 240 76" stroke="#eaf6fc" stroke-width="14" stroke-linecap="round"/>
    <rect x="176" y="62" width="10" height="206" fill="#f5efdc" stroke="#232b38" stroke-width="5"/>
    <path d="M78 44 q -4 -28 8 -44 M88 42 q 8 -24 26 -32 M82 44 q -18 -14 -24 -32"
          fill="none" stroke="#4da44e" stroke-width="9" stroke-linecap="round"/>
    <path d="M60 40 L 108 40 L 101 74 L 67 74 Z" fill="#d97f4a" stroke="#232b38" stroke-width="7"/>
  </g>

  <!-- Sparkles, stars, floating cereal, confetti -->
  <use href="#sparkle" x="440" y="90"/>
  <use href="#sparkle" x="600" y="220" transform="scale(0.85)"/>
  <use href="#goldstar" x="390" y="200"/>
  <use href="#goldstar" x="960" y="90"/>
  <use href="#ball" x="500" y="160" fill="#e26a8d"/>
  <use href="#ball" x="570" y="100" fill="#e8873c"/>
  <use href="#ball" x="450" y="300" fill="#7890d0"/>
  <rect x="650" y="50" width="42" height="38" fill="#a8d878" stroke="#232b38" stroke-width="6" transform="rotate(12 671 69)"/>

  <!-- Back counter: red top, teal front with hatching -->
  <rect x="0" y="430" width="1024" height="80" fill="#e0574f" stroke="#232b38" stroke-width="9"/>
  <rect x="0" y="510" width="1024" height="190" fill="#46b8c8" stroke="#232b38" stroke-width="9"/>
  <g stroke="#2f97a8" stroke-width="8" opacity="0.9">
    <path d="M100 550 l -28 84"/><path d="M300 565 l -28 84"/><path d="M520 545 l -28 84"/>
    <path d="M740 565 l -28 84"/><path d="M940 550 l -28 84"/>
  </g>

  <!-- Items on the back counter -->
  <use href="#jug" transform="translate(700 130) scale(0.92)"/>
  <use href="#jug" transform="translate(560 210) scale(0.62)"/>
  <!-- blue bowl with cereal balls -->
  <g>
    <g fill="#e8b04c">
      <use href="#ball" x="150" y="340"/><use href="#ball" x="200" y="322"/><use href="#ball" x="252" y="338"/>
      <use href="#ball" x="176" y="306" fill="#c98a3c"/><use href="#ball" x="228" y="302" fill="#c98a3c"/>
    </g>
    <path d="M70 350 Q 78 448 200 448 Q 322 448 330 350 Q 200 382 70 350 Z"
          fill="#8fc3ea" stroke="#232b38" stroke-width="9"/>
    <ellipse cx="200" cy="353" rx="131" ry="28" fill="none" stroke="#232b38" stroke-width="9"/>
    <path d="M96 396 q 12 30 46 40" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
  </g>
  <!-- yellow bowl with blueberries -->
  <g>
    <circle cx="382" cy="372" r="15" fill="#6b4a8f" stroke="#232b38" stroke-width="6"/>
    <circle cx="418" cy="366" r="15" fill="#7d5ba3" stroke="#232b38" stroke-width="6"/>
    <circle cx="400" cy="350" r="15" fill="#6b4a8f" stroke="#232b38" stroke-width="6"/>
    <path d="M400 332 q 14 -18 30 -16" fill="none" stroke="#4da44e" stroke-width="8" stroke-linecap="round"/>
    <path d="M340 380 Q 346 452 400 452 Q 454 452 460 380 Q 400 400 340 380 Z"
          fill="#f0b429" stroke="#232b38" stroke-width="8"/>
  </g>
  <!-- red sugar bowl far left -->
  <g>
    <rect x="24" y="290" width="10" height="70" rx="5" fill="#c9ced4" stroke="#232b38" stroke-width="5" transform="rotate(18 29 325)"/>
    <path d="M0 352 Q 6 440 60 440 Q 114 440 120 352 Q 60 372 0 352 Z" fill="#d84848" stroke="#232b38" stroke-width="8"/>
    <ellipse cx="60" cy="356" rx="55" ry="15" fill="#ffffff" stroke="#232b38" stroke-width="6"/>
  </g>
  <!-- plate with loops -->
  <g>
    <ellipse cx="520" cy="440" rx="95" ry="24" fill="#f4f8fb" stroke="#232b38" stroke-width="8"/>
    <g fill="none" stroke-width="12">
      <circle cx="492" cy="422" r="16" stroke="#e8a83c"/>
      <circle cx="530" cy="416" r="16" stroke="#d9821e"/>
      <circle cx="560" cy="426" r="16" stroke="#e8a83c"/>
    </g>
  </g>

  <!-- Front table: warm top + striped runner -->
  <rect x="0" y="700" width="1024" height="70" fill="#f2a93b" stroke="#232b38" stroke-width="9"/>
  <g>
    <rect x="0" y="770" width="1024" height="120" fill="#fdf0f4"/>
    <g fill="#f2b8cc">
      <rect x="0" y="770" width="80" height="120"/><rect x="160" y="770" width="80" height="120"/>
      <rect x="320" y="770" width="80" height="120"/><rect x="480" y="770" width="80" height="120"/>
      <rect x="640" y="770" width="80" height="120"/><rect x="800" y="770" width="80" height="120"/>
      <rect x="960" y="770" width="64" height="120"/>
    </g>
    <rect x="0" y="770" width="1024" height="120" fill="none" stroke="#232b38" stroke-width="8"/>
  </g>

  <!-- Tablecloth front with items -->
  <rect x="0" y="890" width="1024" height="134" fill="#3fb0c4" stroke="#232b38" stroke-width="9"/>
  <g stroke="#2f97a8" stroke-width="7" opacity="0.9">
    <path d="M140 920 l -22 70"/><path d="M420 930 l -22 70"/><path d="M700 920 l -22 70"/><path d="M940 930 l -22 70"/>
  </g>
  <g>
    <ellipse cx="190" cy="975" rx="130" ry="32" fill="#f4f8fb" stroke="#232b38" stroke-width="9"/>
    <use href="#strawberry" transform="translate(150 958)"/>
    <use href="#strawberry" transform="translate(225 966) scale(0.85) rotate(14)"/>
  </g>
  <g transform="rotate(-10 500 970)">
    <rect x="490" y="930" width="20" height="90" rx="10" fill="#d4dade" stroke="#232b38" stroke-width="7"/>
    <ellipse cx="500" cy="918" rx="28" ry="36" fill="#e4eaee" stroke="#232b38" stroke-width="7"/>
  </g>
  <use href="#ball" x="640" y="990" fill="#e26a8d"/>
  <use href="#ball" x="900" y="975" fill="#e8873c"/>
</svg>
